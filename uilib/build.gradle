plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-android'
}
def productProps = getVersionConfig()
android {
    namespace 'com.fingertip.uilib'
    compileSdkVersion rootProject.versions["compileSdkVersion"]
    defaultConfig {
        minSdkVersion rootProject.versions["minSdkVersion"]
        targetSdkVersion rootProject.versions["targetSdkVersion"]

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                "lib/**/libc++_shared.so"
            ]
        }
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfilament-jni.so'
        pickFirst '**/libgltfio-jni.so'
    }

}

dependencies {

    api project(path: ':baseLib')

    implementation 'com.tencent.bugly:crashreport:latest.release'

    // ==================== 海外版新增 ====================
    // Google 登录（Credential Manager，官方推荐替代已废弃的 GoogleSignIn）
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // 应用内购买（Google Play Billing）。7.x 对应 Play Billing 7，
    // 服务端验单走 purchases.products.get / purchases.subscriptionsv2.get
    implementation 'com.android.billingclient:billing-ktx:7.1.1'

    // FCM：离线推送 token（腾讯云 IM 厂商通道下发）+ 设备档案
    // 不接 google-services 插件，Firebase 参数在 strings.xml 手动配置（见 DeviceProfile）
    implementation 'com.google.firebase:firebase-messaging:24.1.0'

    // 腾讯云 IM（腾讯 RTC Chat）：私信收发、图片/视频/语音消息、漫游同步
    api 'com.tencent.imsdk:imsdk-plus:8.9.7545'

    // 动画支持
    implementation 'androidx.core:core-animation:1.0.0'

    // Lottie（JSON 动画）：拜佛页动态场景层（香烟/光晕/火焰）预留
    implementation 'com.airbnb.android:lottie:6.4.0'

    // 佛龛轮播（手指跟手滑动 + 循环）
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}