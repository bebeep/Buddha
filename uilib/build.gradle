plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-android'
}
def productProps = getVersionConfig()
android {
    namespace 'com.fingertip.uilib'
    compileSdkVersion rootProject.versions["compileSdkVersion"]
    defaultConfig {
        minSdkVersion rootProject.versions["minSdkVersion"]
        targetSdkVersion rootProject.versions["targetSdkVersion"]

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                "lib/**/libc++_shared.so"
            ]
        }
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfilament-jni.so'
        pickFirst '**/libgltfio-jni.so'
    }

}

dependencies {

    api project(path: ':baseLib')

    implementation 'com.tencent.bugly:crashreport:latest.release'

    // Sceneform-EQR (EQ-Renderer) 3D渲染引擎 - 本地源码模块
    api project(':eq-renderer')
    // EQ-Renderer 需要的 ARCore (compileOnly传递)
    implementation 'com.google.ar:core:1.45.0'
    // 动画支持
    implementation 'androidx.core:core-animation:1.0.0'
}