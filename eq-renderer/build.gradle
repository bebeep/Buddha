plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.eqgis.eqr'
    ndkVersion versions.ndk

    defaultConfig {
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        compileSdk versions.compileSdk
        versionCode 12
        versionName "1.2.0"

        ndk{
            abiFilters /*'armeabi-v7a',*/'arm64-v8a'
        }
        
        externalNativeBuild {
            cmake {
                arguments.addAll(rootProject.ext.cmakeArgs)
                cppFlags.addAll(rootProject.ext.cppFlags)
            }
        }
    }

    buildTypes {
        release {
            //混淆 proguard-rules.pro
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}

dependencies {
    api androidx_libs.values()

    //AR相关采用在线依赖
//    compileOnly 'com.google.ar:core:1.39.0'
    compileOnly 'com.google.ar:core:1.45.0'

    compileOnly 'com.huawei.hms:arenginesdk:4.0.0.5'

    //slam库 不再引入，已将EqSlamLayout移至app模块
//    compileOnly files("libs/eq-slam.jar")//若要使用”eq-slam“的功能，需单独引用”eq-slam-1.x.x.aar“,这里仅在编译时使用
    //opencv 的java部分代码库，注意：这里要剔除opencv.so和libc++_shared.so，用户使用时单独引用opencv，不合并在这个模块中
//    compileOnly files('libs\\opencv-4.5.5-java.jar')
}


